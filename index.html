<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="./index.css" type="text/css"/>
    <title>RGB Color Generator</title>
</head>
<body>
    <!-- overall -->
    <main class="overall" id="overallBack">

        <!-- rgb box -->
        <aside class="container">
            <section class="top">
                <h1 class="heading">R-G-B Generator</h1>
                <h1 id="color">RGB(0, 0, 0)</h1>
            </section>
            
            <section class="bottom">
                <button onclick="resetColor()">
                    Reset
                </button>
                <button onclick="generateColor()">
                    Random Generator
                </button>
            </section>
        </aside>

    </main>

    <script src="./index.js"></script>
</body>
</html>
